spring:
  application:
    name: dlmm-notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      # Sprint 4 #4.10: was `update` (silent schema mutation). Now
      # `validate` — all schema work via Liquibase changesets.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8087

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
