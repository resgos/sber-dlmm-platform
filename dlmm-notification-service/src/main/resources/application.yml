spring:
  application:
    name: dlmm-notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8087

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO
