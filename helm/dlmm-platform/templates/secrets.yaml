{{/*
Placeholder Secret manifest — production deployments MUST replace this with
externally managed secrets (HashiCorp Vault via external-secrets-operator,
AWS Secrets Manager, GCP Secret Manager, or SBSC / Сбер Secret Service).

DO NOT commit real secret values into the chart values. The defaults in
values.yaml are "CHANGE_ME_via_deploy_pipeline" sentinels — the deploy
pipeline must override via `--set secrets.jwtSecret=$JWT_SECRET` (the
CI keeps these in GitHub encrypted secrets, never echoed to logs).

TODO (production hardening):
  1. Install external-secrets-operator in the cluster.
  2. Create an `ExternalSecret` pointing at Vault / SBSC keypath:
       spec:
         secretStoreRef: { name: sbsc-vault, kind: ClusterSecretStore }
         target:
           name: {{ include "dlmm.fullname" . }}-secrets
         data:
           - secretKey: JWT_SECRET
             remoteRef: { key: dlmm/prod/jwt, property: secret }
           - secretKey: DB_PASSWORD
             remoteRef: { key: dlmm/prod/db,  property: password }
  3. Drop this file (set .Values.secrets.disabled=true to skip rendering),
     letting the operator manage the Secret with the same name.
*/}}
{{- if not .Values.secrets.disabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dlmm.fullname" . }}-secrets
  labels:
    {{- include "dlmm.labels" . | nindent 4 }}
  annotations:
    # TODO: when external-secrets-operator manages this secret, remove
    # the chart-managed Secret entirely; remove this annotation.
    helm.sh/hook-policy: keep
type: Opaque
stringData:
  # Each entry below MUST be overridden at deploy time. The values shown
  # are sentinel placeholders that will cause services to fail-fast on
  # boot (Spring fail-fast validation rejects "CHANGE_ME_*" tokens via
  # the @Value bindings in our service application.yaml files).
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  {{- with .Values.secrets.kafkaUsername }}
  KAFKA_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.kafkaPassword }}
  KAFKA_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dlmm.serviceAccountName" . }}
  labels:
    {{- include "dlmm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
