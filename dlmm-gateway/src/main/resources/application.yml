spring:
  application:
    name: dlmm-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: token-service
          uri: ${TOKEN_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/tokens/**
        - id: balance-service
          uri: ${TOKEN_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/balances/**
        # Sprint 5 #5.3 + #5.4 — SberSpasibo loyalty endpoints live in
        # token-service (mint webhook + user-initiated convert).
        - id: spasibo
          uri: ${TOKEN_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/spasibo/**
        # Sprint 5 #5.6 + #5.7 — B2B portal MVP (issuer KYB + billing)
        # also lives in token-service for cohesion with token issuance.
        - id: b2b-portal
          uri: ${TOKEN_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/b2b/**
        - id: pool-engine
          uri: ${POOL_ENGINE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/pools/**
        - id: fee-service
          uri: ${FEE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/fees/**
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/transactions/**
        - id: price-oracle
          uri: ${PRICE_ORACLE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/oracle/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
        - id: admin-bff
          uri: ${ADMIN_BFF_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/admin/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 150
            key-resolver: "#{@userKeyResolver}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
  cors:
    # Dev defaults — the two UI dev servers + the gateway's own URL for
    # Swagger UI hitting itself. Production overrides via
    # application-prod.yml to lock down to the Sber-owned domains.
    # Comma-separated string (not YAML list) — see CorsConfiguration
    # for the binding rationale.
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:8080

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework: INFO

# Sprint 3 #3.12: gateway actuator. Reactive endpoints — no separate
# permitAll config needed because gateway routes don't catch /actuator/**
# (no predicate matches it), so it falls through to the actuator's
# own handler with default permitAll.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
