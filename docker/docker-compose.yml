version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: dlmm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dlmm
      POSTGRES_USER: ${DB_USER:-dlmm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
    # Sprint 3 #3.6: 6 JPA services × 50 Hikari = 300 connections.
    # Default 100 isn't enough; bump to 400 with a small headroom for
    # admin/psql clients. Prod uses pgBouncer; this is dev compose.
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./02-extended-assets.sql:/docker-entrypoint-initdb.d/02-extended-assets.sql
      - ./03-seed-trading-history.sql:/docker-entrypoint-initdb.d/03-seed-trading-history.sql
      - ./04-spasibo-seed.sql:/docker-entrypoint-initdb.d/04-spasibo-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlmm -d dlmm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlmm-network

  redis:
    image: redis:7
    container_name: dlmm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlmm-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: dlmm-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dlmm-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dlmm-kafka
    # Sprint 9 — Kafka JVM defaults to 1 GB heap. On a 7.6 GiB dev host that
    # leaves nothing for the 8 Java services. 512m heap is fine for the dev
    # workload (4 topics, 3 partitions each, RF=1, no consumers driving it
    # hard). Production gets its own sizing in the Helm chart.
    mem_limit: 768m
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
      - ./init-kafka-topics.sh:/init-kafka-topics.sh
    networks:
      - dlmm-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dlmm-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "/init-kafka-topics.sh"]
    volumes:
      - ./init-kafka-topics.sh:/init-kafka-topics.sh
    networks:
      - dlmm-network
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: dlmm-clickhouse
    # ClickHouse defaults are tuned for >16 GB hosts and will happily eat
    # 2-4 GB just sitting idle. Hard cap at 512m + matching ClickHouse
    # config so the OOM-killer doesn't pick it as the largest victim.
    mem_limit: 512m
    environment:
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE: "402653184"   # 384 MiB
      CLICKHOUSE_MAX_MEMORY_USAGE_FOR_USER: "268435456" # 256 MiB
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - dlmm-network

  # ─── Java Services ─────────────────────────────────────────────────────────────

  dlmm-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-gateway
    container_name: dlmm-gateway
    # Sprint 9 — JVM heap cap to stop the OOM-killer loops on Docker Desktop
    # (7.6 GiB host). Default JVM grabs ~25% of host = ~1.9 GB per service;
    # 8 Java services × 1.9 GB > host RAM long before infra is counted.
    # 384m max heap is plenty for the gateway (mostly netty + filters, no
    # JPA/Hibernate); container limit 512m gives metaspace + direct buffer
    # headroom. Adjust upward per-service only if metrics show GC pressure.
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
      USER_SERVICE_URL: http://dlmm-user-service:8081
      TOKEN_SERVICE_URL: http://dlmm-token-service:8082
      POOL_ENGINE_URL: http://dlmm-pool-engine:8083
      FEE_SERVICE_URL: http://dlmm-fee-service:8084
      TRANSACTION_SERVICE_URL: http://dlmm-transaction-service:8085
      PRICE_ORACLE_URL: http://dlmm-price-oracle:8086
      NOTIFICATION_SERVICE_URL: http://dlmm-notification-service:8087
      ADMIN_BFF_URL: http://dlmm-admin-bff:8088
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-user-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-user-service
    container_name: dlmm-user-service
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-token-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-token-service
    container_name: dlmm-token-service
    mem_limit: 512m
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-pool-engine:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-pool-engine
    # NOTE: TOKEN_SERVICE_URL is set below — pool-engine WebClient depends on
    # it for swap/balance forwarding. Without it, default localhost:8082 is
    # used (which inside docker is the pool-engine container itself, not
    # token-service) — swaps would fail with Connection refused.
    container_name: dlmm-pool-engine
    # Slightly higher cap — pool-engine carries Caffeine token cache, outbox
    # dispatcher (@Scheduled), and the swap pipeline's hottest code path.
    mem_limit: 640m
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
      TOKEN_SERVICE_URL: http://dlmm-token-service:8082
      USER_SERVICE_URL: http://dlmm-user-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-fee-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-fee-service
    container_name: dlmm-fee-service
    mem_limit: 512m
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-transaction-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-transaction-service
    container_name: dlmm-transaction-service
    mem_limit: 512m
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
      # Sprint 4 #4.6 — B2B settlement endpoint calls token-service for
      # deduct/credit. Without this var the default localhost:8082 would
      # resolve to the transaction-service container itself.
      TOKEN_SERVICE_URL: http://dlmm-token-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-price-oracle:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-price-oracle
    container_name: dlmm-price-oracle
    mem_limit: 512m
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-notification-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-notification-service
    container_name: dlmm-notification-service
    mem_limit: 512m
    ports:
      - "8087:8087"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dlmm-network

  dlmm-admin-bff:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-admin-bff
    container_name: dlmm-admin-bff
    mem_limit: 512m
    ports:
      - "8088:8088"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
      DB_HOST: postgres
      DB_USER: ${DB_USER:-dlmm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in docker/.env}
      USER_SERVICE_URL: http://dlmm-user-service:8081
      TOKEN_SERVICE_URL: http://dlmm-token-service:8082
      POOL_ENGINE_URL: http://dlmm-pool-engine:8083
      FEE_SERVICE_URL: http://dlmm-fee-service:8084
      TRANSACTION_SERVICE_URL: http://dlmm-transaction-service:8085
      PRICE_ORACLE_URL: http://dlmm-price-oracle:8086
    depends_on:
      - dlmm-user-service
      - dlmm-token-service
      - dlmm-pool-engine
      - dlmm-fee-service
      - dlmm-transaction-service
      - dlmm-price-oracle
      - dlmm-notification-service
    networks:
      - dlmm-network

  dlmm-admin-ui:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: dlmm-admin-ui
    ports:
      - "3000:80"
    depends_on:
      - dlmm-admin-bff
      - dlmm-gateway
    networks:
      - dlmm-network

  dlmm-user-ui:
    build:
      context: ..
      dockerfile: Dockerfile.user-frontend
    container_name: dlmm-user-ui
    ports:
      - "3001:80"
    depends_on:
      - dlmm-gateway
    networks:
      - dlmm-network

  # Sprint 5 #5.8 — public status page mirroring /actuator/health across
  # all backend services. Pure HTML + vanilla JS in a vanilla nginx
  # container — no build step, no supply-chain risk. Production behind
  # status.dlmm.sber-online.ru via reverse-proxy.
  dlmm-status-page:
    image: nginx:1.25-alpine
    container_name: dlmm-status-page
    ports:
      - "8090:80"
    volumes:
      - ./status-page/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - dlmm-gateway
    networks:
      - dlmm-network

  # Prometheus scrapes /actuator/prometheus on every Spring Boot service.
  # Config in ./prometheus/prometheus.yml. Storage stays in a named volume
  # so metrics survive container restarts.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dlmm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    networks:
      - dlmm-network

  # Grafana with auto-provisioned Prometheus datasource + the DLMM overview
  # dashboard. Anonymous viewer access for demos (read-only); admin still
  # needs login (default admin/admin until first password change).
  grafana:
    image: grafana/grafana:11.2.2
    container_name: dlmm-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - dlmm-network

networks:
  dlmm-network:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
