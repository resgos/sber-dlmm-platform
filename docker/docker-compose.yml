      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-pool-engine
    container_name: dlmm-pool-engine
    ports:
      - "8083:8080"
    environment:
      DB_HOST: postgres
      DB_USER: dlmm
      DB_PASS: dlmm_secret
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-for-dlmm-platform-256-bit-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
