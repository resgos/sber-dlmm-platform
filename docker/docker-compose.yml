  dlmm-admin-bff:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-admin-bff
    container_name: dlmm-admin-bff
    ports:
      - "8088:8080"
    environment:
      DB_HOST: postgres
      DB_USER: dlmm
      DB_PASS: dlmm_secret
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-for-dlmm-platform-256-bit-min
      USER_SERVICE_URL: http://dlmm-user-service:8081
      TOKEN_SERVICE_URL: http://dlmm-token-service:8082
      POOL_ENGINE_URL: http://dlmm-pool-engine:8083
      FEE_SERVICE_URL: http://dlmm-fee-service:8084
      TRANSACTION_SERVICE_URL: http://dlmm-transaction-service:8085
      PRICE_ORACLE_URL: http://dlmm-price-oracle:8086
