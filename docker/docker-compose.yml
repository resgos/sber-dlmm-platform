  dlmm-admin-ui:
    image: nginx:alpine
    container_name: dlmm-admin-ui
    ports:
      - "3000:80"
    volumes:
      - ./admin-ui-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - dlmm-admin-bff
      - dlmm-gateway
    networks:
      - dlmm-network

networks:
  dlmm-network:
    driver: bridge

volumes:
  postgres-data:
