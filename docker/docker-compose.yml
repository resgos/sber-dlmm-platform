    networks:
      - dlmm-network

  dlmm-fee-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: dlmm-fee-service
    container_name: dlmm-fee-service
    ports:
      - "8084:8080"
    environment:
      DB_HOST: postgres
      DB_USER: dlmm
      DB_PASS: dlmm_secret
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-for-dlmm-platform-256-bit-min
