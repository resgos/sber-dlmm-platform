name: frontend

# Type-check + Vitest for both UIs. Only triggered when the UI folders
# (or this file) change — keeps minutes free for backend churn.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "dlmm-admin-ui/**"
      - "dlmm-user-ui/**"
      - "scripts/check-no-hex-in-tsx.mjs"
      - "scripts/hex-baseline.json"
      - "scripts/check-ui-shared-drift.mjs"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "dlmm-admin-ui/**"
      - "dlmm-user-ui/**"
      - "scripts/check-no-hex-in-tsx.mjs"
      - "scripts/hex-baseline.json"
      - "scripts/check-ui-shared-drift.mjs"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sprint 8 AU-2: design-token ratchet. Blocks PRs that add hex literals
  # to any .tsx file (baseline at scripts/hex-baseline.json). Runs before
  # the matrix so a token regression fails fast.
  hex-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check no new hex in .tsx
        run: node scripts/check-no-hex-in-tsx.mjs

      # Sprint 9-DS-r4 P2-17 — UI shared-code drift watchdog.
      # Files duplicated between admin-ui and user-ui (format helpers,
      # KpiTile, TokenPairChip) must stay in lockstep until the
      # Sprint 10 workspaces refactor lands. Strict entries (lib/utils
      # format, TokenPairChip) fail the build on byte-level drift.
      # Relaxed entries (KpiTile) emit an INFO line documenting the
      # divergence — see scripts/check-ui-shared-drift.mjs for the
      # manifest + rationale.
      - name: Check UI shared-code drift
        run: node scripts/check-ui-shared-drift.mjs

  ui:
    needs: hex-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ui: [dlmm-admin-ui, dlmm-user-ui]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.ui }}/package-lock.json

      # npm ci (not install) — locks to package-lock.json + fails on
      # missing entries. Catches dep drift in PRs.
      - name: npm ci
        working-directory: ${{ matrix.ui }}
        run: npm ci

      # Vitest unit tests. Continue-on-error: false (default) so they're
      # a hard gate. tsc + vite build below catches type drift even
      # without strict noUnusedLocals.
      - name: Vitest
        working-directory: ${{ matrix.ui }}
        run: npm run test -- --run --reporter=verbose

      - name: Build (tsc + vite)
        working-directory: ${{ matrix.ui }}
        run: npm run build

  # Playwright e2e for the user-facing UI. Separate job (not in the matrix)
  # because (a) only dlmm-user-ui has e2e specs, (b) the chromium download is
  # heavy enough we want it cached. Specs run against `vite preview` of the
  # production build with API responses mocked via page.route — no docker /
  # postgres / kafka needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dlmm-user-ui/package-lock.json

      - name: npm ci
        working-directory: dlmm-user-ui
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dlmm-user-ui/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: dlmm-user-ui
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        working-directory: dlmm-user-ui
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dlmm-user-ui/playwright-report/
          retention-days: 7
