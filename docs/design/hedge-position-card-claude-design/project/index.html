<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sber DLMM — Хедж FX</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --green: #21A038;
    --green-hover: #1B8A2F;
    --green-tint: #E8F5EA;
    --green-tint-strong: #D2EBD6;
    --red: #DC2626;
    --red-tint: #FCEBEC;

    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-2: #F5F5F2;
    --border: #ECECE7;
    --border-strong: #D9D9D2;
    --text: #0F1311;
    --text-2: #5E6964;
    --text-3: #8A938E;

    --radius: 14px;
    --radius-sm: 8px;
    --gap-card: 14px;
    --pad-card: 22px;

    --font: "Onest", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  [data-density="compact"] { --pad-card: 16px; --gap-card: 10px; }
  [data-density="spacious"] { --pad-card: 28px; --gap-card: 18px; }

  [data-dark="true"] {
    --bg: #0E1311;
    --surface: #161C19;
    --surface-2: #1E2521;
    --border: #242B27;
    --border-strong: #303832;
    --text: #F2F4F1;
    --text-2: #A4ADA7;
    --text-3: #6E7872;
    --green-tint: rgba(33,160,56,0.18);
    --green-tint-strong: rgba(33,160,56,0.28);
    --red-tint: rgba(220,38,38,0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-feature-settings: "ss01", "cv11";
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* layout */
  .app { min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 24px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 15px; letter-spacing: -0.005em;
  }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 7px;
    background: var(--green);
    display: grid; place-items: center;
    color: #fff;
    font-weight: 700; font-size: 13px;
    letter-spacing: -0.04em;
  }
  .brand-sub { color: var(--text-3); font-weight: 400; padding-left: 2px; }

  .nav { display: flex; gap: 4px; }
  .nav a {
    padding: 6px 12px; border-radius: 8px;
    color: var(--text-2); text-decoration: none;
    font-size: 13.5px; font-weight: 500;
  }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { color: var(--text); background: var(--surface-2); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .topbar-right .acct {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 6px 6px; border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 13px; color: var(--text-2);
  }
  .topbar-right .acct .avi {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #21A038, #157A28);
    color: #fff; display: grid; place-items: center;
    font-size: 11px; font-weight: 600;
  }

  /* page */
  .page { max-width: 1240px; margin: 0 auto; padding: 36px 32px 80px; }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 28px;
  }
  .breadcrumb { font-size: 12.5px; color: var(--text-3); letter-spacing: 0.01em; margin-bottom: 8px; }
  .breadcrumb b { color: var(--text-2); font-weight: 500; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.1; }
  .page-head .lede { color: var(--text-2); margin-top: 8px; font-size: 14px; max-width: 540px; }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    height: 38px; padding: 0 16px; border-radius: 10px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 120ms ease, transform 60ms ease, box-shadow 120ms ease, color 120ms ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(0.5px); }
  .btn-primary {
    background: var(--green); color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 1px 2px rgba(33,160,56,0.25);
  }
  .btn-primary:hover { background: var(--green-hover); }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-soft { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-soft:hover { border-color: var(--border-strong); }
  .btn-danger-soft { background: var(--red-tint); color: var(--red); }
  .btn-danger-soft:hover { background: #f8d7d9; }
  [data-dark="true"] .btn-danger-soft:hover { background: rgba(220,38,38,0.24); }

  /* summary strip */
  .strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 28px;
  }
  .strip > div {
    background: var(--surface);
    padding: 18px 22px;
  }
  .strip .k { font-size: 12px; color: var(--text-3); letter-spacing: 0.01em; margin-bottom: 6px; }
  .strip .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .strip .v .unit { font-size: 13px; color: var(--text-3); font-weight: 500; margin-left: 4px; }
  .strip .sub { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
  .delta-pos { color: var(--green); }
  .delta-neg { color: var(--red); }

  /* filters */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-group { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; }
  .chip {
    appearance: none; border: 0; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-2);
    height: 28px; padding: 0 12px; border-radius: 7px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  [data-dark="true"] .chip.active { background: var(--bg); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .toolbar-spacer { flex: 1; }

  .search {
    height: 36px; min-width: 240px;
    padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: inherit; font-size: 13.5px;
    color: var(--text);
    outline: none;
    transition: border-color 120ms ease;
  }
  .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
  .search::placeholder { color: var(--text-3); }

  /* card list */
  .list { display: flex; flex-direction: column; gap: 12px; }

  .position {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--pad-card);
    transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    position: relative;
  }
  .position:hover {
    border-color: var(--border-strong);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 18px -8px rgba(15,19,17,0.08);
  }

  .position-row {
    display: grid;
    grid-template-columns: minmax(220px, 1.2fr) minmax(180px, 1fr) minmax(140px, 0.9fr) minmax(200px, 1.2fr) auto;
    align-items: center;
    gap: 28px;
  }

  /* col 1: identity */
  .pair-block { min-width: 0; }
  .pair-pill {
    display: inline-flex; align-items: center; gap: 8px;
    height: 26px; padding: 0 11px 0 8px;
    border-radius: 999px;
    background: var(--green-tint);
    color: var(--green);
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.005em;
    border: 1px solid transparent;
  }
  .pair-pill .arrow { opacity: 0.7; }
  .pair-pill .from, .pair-pill .to { display: inline-flex; align-items: center; gap: 5px; }
  .pair-pill .tok {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; display: grid; place-items: center;
    font-size: 8px; font-weight: 700; color: var(--green);
    border: 1px solid currentColor;
  }
  .meta {
    margin-top: 10px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--text-3);
  }
  .meta .id { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
  .meta .sep { width: 3px; height: 3px; background: var(--text-3); border-radius: 50%; opacity: 0.5; }

  /* col 2: amount */
  .amount-block .amount {
    font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15;
  }
  .amount-block .amount .unit { color: var(--text-2); font-weight: 500; font-size: 17px; margin-left: 6px; letter-spacing: 0; }
  .amount-block .eq {
    margin-top: 6px;
    font-size: 12.5px; color: var(--text-2);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .amount-block .eq .sep { width: 3px; height: 3px; background: var(--text-3); border-radius: 50%; opacity: 0.5; flex-shrink: 0; }
  .amount-block .rate { color: var(--text-3); }

  /* col 3: chart */
  .spark {
    width: 100%; height: 44px; display: block;
  }
  .spark-label {
    margin-top: 4px; font-size: 11px; color: var(--text-3);
    display: flex; justify-content: space-between;
    letter-spacing: 0.02em;
  }

  /* col 4: value */
  .value-block .label { font-size: 12px; color: var(--text-3); margin-bottom: 4px; letter-spacing: 0.01em; }
  .value-block .value { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .value-block .value .unit { color: var(--text-2); font-weight: 500; font-size: 14px; margin-left: 4px; letter-spacing: 0; }
  .value-block .delta {
    margin-top: 6px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
  }
  .delta-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .delta-pill.pos { background: var(--green-tint); color: var(--green); }
  .delta-pill.neg { background: var(--red-tint); color: var(--red); }
  .delta-abs.pos { color: var(--green); }
  .delta-abs.neg { color: var(--red); }

  /* col 5: actions */
  .actions-block { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  /* details expand */
  .details {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--border-strong);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
    font-size: 13px;
  }
  .details .kv .k { color: var(--text-3); font-size: 11.5px; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 4px; }
  .details .kv .v { color: var(--text); font-weight: 500; }
  .details .kv .v.mono { font-family: var(--font-mono); font-size: 12px; }

  /* close confirmation */
  .confirm {
    position: absolute;
    right: var(--pad-card);
    top: calc(100% - 12px);
    width: 320px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px -10px rgba(15,19,17,0.18), 0 4px 12px rgba(15,19,17,0.06);
    padding: 16px;
    z-index: 10;
    animation: pop 140ms cubic-bezier(.2,.7,.3,1.1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .confirm .h { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .confirm .b { font-size: 12.5px; color: var(--text-2); margin-bottom: 12px; line-height: 1.45; }
  .confirm .recap {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12.5px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .confirm .recap .row { display: flex; justify-content: space-between; }
  .confirm .recap .row .l { color: var(--text-3); }
  .confirm .recap .row .r { color: var(--text); font-weight: 500; }
  .confirm .actions { display: flex; gap: 8px; }
  .confirm .actions .btn { flex: 1; justify-content: center; }

  /* closing state */
  .position[data-state="closing"] { opacity: 0.55; pointer-events: none; }
  .position[data-state="closed"] {
    opacity: 0.45;
    background: var(--surface-2);
  }

  /* empty footer */
  .foot {
    margin-top: 28px;
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
  }

  /* responsive squeeze */
  @media (max-width: 1100px) {
    .position-row { grid-template-columns: 1fr 1fr; row-gap: 18px; }
    .actions-block { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; align-items: center; }
    .details { grid-template-columns: repeat(2, 1fr); }
    .strip { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</body>
