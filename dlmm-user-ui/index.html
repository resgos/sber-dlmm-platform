<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СБЕР DLMM — Платформа ликвидности</title>
    <!-- Sprint 9 — Onest is a Cyrillic-friendly fintech sans designed
         for RU/EN; picked by Claude Design when it generated the Хедж FX
         mockup (docs/design/hedge-position-card-claude-design/). preconnect
         shaves ~150ms off first paint by warming the TLS handshake before
         the stylesheet request lands. JetBrains Mono is for transaction
         IDs / refs so they don't blend with the body copy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
