server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sprint 9 — Docker DNS (127.0.0.11) + variable upstream so nginx
    # re-resolves the dlmm-gateway IP every 10s instead of caching it
    # at startup. Without this, recreating the gateway container (which
    # gets a fresh IP from the docker network) gave nginx a stale IP
    # and every /api/ POST returned 502 until the UI container was
    # restarted too. valid=10s is fine for dev; in k8s the Service IP
    # is stable so this is harmless.
    #
    # IMPORTANT proxy_pass quirk: with a variable in proxy_pass nginx does
    # NOT strip the location prefix from the request URI, so any path
    # suffix on the proxy_pass URL gets duplicated. Must be `$var` (no
    # trailing path) + `$request_uri` so the full incoming path is
    # forwarded as-is — `proxy_pass $var/api/` would send /api/api/...
    # and every request would 404.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://dlmm-gateway:8080;

    location /api/ {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must NOT be browser-cached — it references the content-hashed
    # asset bundles, so a stale cached copy keeps loading an OLD bundle after a
    # redeploy (stale UI until a manual hard refresh; this bit us during live UI
    # testing). Assets stay immutable-cached below; index.html is forced to
    # revalidate. try_files deep-links redirect to /index.html and re-enter
    # location matching, so this header also covers SPA routes, not just `/`.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
