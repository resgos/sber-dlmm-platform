spring:
  application:
    name: dlmm-price-oracle
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/master.xml
  # Sprint 9-DS-r4 (P1-11) — Kafka consumer for the SwapEventOhlcvConsumer.
  # KAFKA_SERVERS is the env name docker-compose actually passes to this
  # container (same as notification-service). The old ${KAFKA_BOOTSTRAP_SERVERS}
  # name was never set here, so the consumer silently fell back to
  # localhost:9092 and never joined the broker — live swaps produced NO OHLCV
  # candles (found 2026-06-12 by an end-to-end swap smoke: consumer group
  # dlmm-price-oracle-ohlcv did not exist). Group id stays per-service so
  # offsets don't collide with transaction-service's own SwapEventConsumer.
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8086

# No dlmm.jwt.secret here — price-oracle doesn't depend on jjwt and the
# common JWT auto-config now (Sprint 3 #3.5 follow-up) gates on jjwt
# being on the classpath. Auto-config is silently skipped here.

# Sprint 5 #5.9 — CBR (Bank of Russia) official daily FX rates feed.
# Disable wholesale via dlmm.cbr.enabled=false (handy in dev / load tests
# where outbound cbr.ru calls are noise).
dlmm:
  cbr:
    enabled: ${DLMM_CBR_ENABLED:true}
    url: ${DLMM_CBR_URL:https://www.cbr.ru/scripts/XML_daily.asp}
    currencies: ${DLMM_CBR_CURRENCIES:USD,EUR,CNY}
    # 14:00 server time = ~14:00 MSK if container TZ stays default.
    # CBR publishes ~12:00 MSK so 14:00 gives a 2h buffer for any delays.
    cron: ${DLMM_CBR_CRON:0 0 14 * * *}
  # Sprint 16 — real market-price sync from free public APIs (MarketDataClient):
  # CoinGecko (crypto in RUB) + Bank of Russia daily JSON (FX) + CBR metals (RUB/gram).
  # MOEX ISS (equities/indices) is geo-blocked from this env → those stay synthetic.
  market:
    coingecko-url: ${DLMM_COINGECKO_URL:https://api.coingecko.com/api/v3/simple/price}
    cbr-fx-url: ${DLMM_CBR_FX_URL:https://www.cbr-xml-daily.ru/daily_json.js}
    cbr-metals-url: ${DLMM_CBR_METALS_URL:https://www.cbr.ru/scripts/xml_metall.asp}

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

# Sprint 9-DS-r2 — actuator endpoints were unconfigured, so /actuator/health
# returned NoResourceFoundException (500 via GlobalExceptionHandler) and
# the Docker healthcheck reported the service unhealthy even though the
# app was serving its business endpoints fine. Match the exposure list
# every other service uses.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
