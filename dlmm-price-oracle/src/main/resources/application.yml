spring:
  application:
    name: dlmm-price-oracle
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASS:dlmm_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/master.xml

server:
  port: 8086

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO
