spring:
  application:
    name: dlmm-transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      # Sprint 4 #4.10: was `update` (Hibernate auto-ALTERed schema).
      # Now `validate` — schema mutation goes via Liquibase changesets.
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-transaction-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
  # Sprint 4 #4.6 — B2B settlement endpoint calls token-service via
  # RestTemplate. Bearer-token forwarding is wired in TokenServiceClient.
  services:
    token-service:
      url: ${TOKEN_SERVICE_URL:http://localhost:8082}
  # Sprint 6 #6.9 — AML pattern-detection scheduler tunables.
  # Disable wholesale via DLMM_AML_ENABLED=false in dev / load tests.
  aml:
    enabled: ${DLMM_AML_ENABLED:true}
    scan-interval-ms: ${DLMM_AML_SCAN_INTERVAL_MS:900000}   # 15 min
    initial-delay-ms: ${DLMM_AML_INITIAL_DELAY_MS:120000}   # 2 min after boot
    cooldown-hours: ${DLMM_AML_COOLDOWN_HOURS:4}            # per (user, pattern) dedup
    window-hours: ${DLMM_AML_WINDOW_HOURS:24}               # scan window
    page-size: ${DLMM_AML_PAGE_SIZE:5000}                   # tx scan cap per tick

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
