server:
  port: 8083
  # Sprint 9-DS-r4 (TD-3) — explicit UTF-8 for the embedded servlet
  # container. Without this, Tomcat's default ISO-8859-1 mangles
  # Cyrillic strings in any response where the content-type doesn't
  # carry an explicit charset. Pairs with the Dockerfile's
  # -Dfile.encoding=UTF-8 — JVM + Tomcat both must agree.
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: dlmm-pool-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:dlmm}
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sprint 3 #3.6: bumped 20→50 after k6 baseline showed pool
      # saturation past 20 concurrent (Sprint 2 risk #13). Postgres
      # max_connections default 100, 6 JPA services × 50 = 300 — too
      # high. In prod we'll either raise Postgres limit or use pgBouncer;
      # for dev compose each service gets a smaller fair share and we
      # ride out the 100-connection ceiling.
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000

  liquibase:
    change-log: classpath:db/changelog/master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
  # Sprint 3 #3.9 — shared outbox lib opt-in. Tag every row this service
  # produces so its dispatcher only polls its own queue.
  outbox:
    service-name: pool-engine
  services:
    token-service:
      url: ${TOKEN_SERVICE_URL:http://localhost:8082}
    user-service:
      url: ${USER_SERVICE_URL:http://localhost:8081}
  # Sprint 4 #4.3 — MarginWatchScheduler tunables. Override via env in
  # docker-compose (DLMM_MARGIN_*). Disable wholesale for k6 load tests.
  margin:
    enabled: ${DLMM_MARGIN_ENABLED:true}
    scan-interval-ms: ${DLMM_MARGIN_SCAN_INTERVAL_MS:300000}    # 5 min
    initial-delay-ms: ${DLMM_MARGIN_INITIAL_DELAY_MS:60000}     # 1 min after boot
    warning-bin-distance: ${DLMM_MARGIN_WARNING_DISTANCE:3}     # bins to boundary
    event-cooldown-hours: ${DLMM_MARGIN_COOLDOWN_HOURS:6}       # dedupe window
    page-size: ${DLMM_MARGIN_PAGE_SIZE:500}                     # positions per page

logging:
  level:
    root: INFO
    com.sber.dlmm.pool: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries,timelimiters
  endpoint:
    health:
      # Demo-friendly: anyone hitting /actuator/health sees the
      # per-component breakdown (DB, Kafka, Redis, token-service,
      # user-service). For prod this should drop back to when-authorized.
      show-details: always
      probes:
        enabled: true
    circuitbreakers:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

# ─── Resilience4j: protect inter-service WebClient calls (token-service) ──────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      token-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      token-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      token-service:
        base-config: default
