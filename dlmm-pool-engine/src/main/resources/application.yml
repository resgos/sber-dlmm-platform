server:
  port: 8083

spring:
  application:
    name: dlmm-pool-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:dlmm}
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  liquibase:
    change-log: classpath:db/changelog/master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
  services:
    token-service:
      url: ${TOKEN_SERVICE_URL:http://localhost:8082}

logging:
  level:
    root: INFO
    com.sber.dlmm.pool: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries,timelimiters
  endpoint:
    health:
      show-details: when-authorized
    circuitbreakers:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

# ─── Resilience4j: protect inter-service WebClient calls (token-service) ──────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      token-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      token-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      token-service:
        base-config: default
