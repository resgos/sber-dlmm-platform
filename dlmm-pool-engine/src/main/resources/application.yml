server:
  port: 8083

spring:
  application:
    name: dlmm-pool-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASS:dlmm_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  liquibase:
    change-log: classpath:db/changelog/master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

dlmm:
  jwt:
    secret: ${JWT_SECRET:c2Jlci1kbG1tLXBsYXRmb3JtLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5n}
  services:
    token-service:
      url: ${TOKEN_SERVICE_URL:http://localhost:8081}

logging:
  level:
    root: INFO
    com.sber.dlmm.pool: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
