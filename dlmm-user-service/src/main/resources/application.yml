spring:
  application:
    name: dlmm-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASS:dlmm_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-user-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
  liquibase:
    change-log: classpath:db/changelog/master.xml

server:
  port: 8081

dlmm:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-256-bit-minimum}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO
