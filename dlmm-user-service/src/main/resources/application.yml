spring:
  application:
    name: dlmm-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    # Sprint 3 #3.6: aligned across all JPA services.
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-user-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  # Sprint 9 — Spring Boot 3.2 renamed spring.redis.* → spring.data.redis.*.
  # Servlet LettuceConnectionFactory honored the deprecated path so login
  # cache worked, but RedisReactiveHealthIndicator only reads the new path
  # and was probing localhost:6379 → /actuator/health returned 503 →
  # pool-engine + admin-bff cascaded into DOWN cascades. The other 4
  # services (gateway, pool-engine, token, fee, transaction) already
  # use spring.data.redis.* — user-service was the last lagging one.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  liquibase:
    change-log: classpath:db/changelog/master.xml

server:
  port: 8081

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 7

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
