spring:
  application:
    name: dlmm-fee-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/dlmm
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # Sprint 4 #4.10: wire liquibase so changesets actually run on startup
  # (was missing since Sprint 1 — silent gap).
  liquibase:
    change-log: classpath:db/changelog/master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: dlmm-fee-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  # NOTE: liquibase block lives above (line 18) — duplicate block here was
  # tolerated by older snakeyaml but Spring Boot 3.2 + snakeyaml strict
  # mode rejects it. Removed during Sprint 9 docker bring-up.

server:
  port: 8084

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
  token-service:
    url: ${TOKEN_SERVICE_URL:http://dlmm-token-service:8082}
  # Sprint 12 G-16 — server-side auto-claim watcher. Disable with
  # dlmm.auto-claim.enabled=false (the @ConditionalOnProperty on
  # AutoClaimScheduler skips bean creation entirely).
  auto-claim:
    enabled: ${AUTO_CLAIM_ENABLED:true}
    poll-interval-ms: ${AUTO_CLAIM_POLL_MS:60000}
    initial-delay-ms: ${AUTO_CLAIM_INITIAL_DELAY_MS:30000}

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Sprint 8 C-10 (R#33) — circuit breaker + retry for outbound credit calls
# to token-service from TokenServiceClient. Mirrors pool-engine reference
# tuning so the same alert rules/dashboards apply across services.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      token-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      token-service:
        base-config: default
