spring:
  application:
    name: dlmm-admin-bff
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:dlmm}
    username: ${DB_USER:dlmm}
    password: ${DB_PASSWORD:dlmm_secret}
    driver-class-name: org.postgresql.Driver

server:
  port: 8088

dlmm:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET env var is required (≥32 bytes)}
    access-token-expiry-minutes: 30
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    token-service-url: ${TOKEN_SERVICE_URL:http://localhost:8082}
    pool-engine-url: ${POOL_ENGINE_URL:http://localhost:8083}
    fee-service-url: ${FEE_SERVICE_URL:http://localhost:8084}
    transaction-service-url: ${TRANSACTION_SERVICE_URL:http://localhost:8085}
    price-oracle-url: ${PRICE_ORACLE_URL:http://localhost:8086}

logging:
  level:
    com.sber.dlmm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Surfaces the per-downstream health (token, user, pool, fee, tx) so
      # the admin UI can render a dependency status panel without extra calls.
      show-details: always
      probes:
        enabled: true

# Sprint 8 C-10 (R#33) → Sprint 9-DS-r4 (P1-13) — circuit breaker + retry
# for ALL outbound bff calls.
# Tuning mirrors the pool-engine reference (dlmm-pool-engine/application.yml)
# so operator dashboards/alerts stay consistent across services. One
# instance per downstream so the breaker state is queryable per-target.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      pool-engine:
        base-config: default
      user-service:
        base-config: default
      token-service:
        base-config: default
      transaction-service:
        base-config: default
      fee-service:
        base-config: default
      price-oracle:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      pool-engine:
        base-config: default
      user-service:
        base-config: default
      token-service:
        base-config: default
      transaction-service:
        base-config: default
      fee-service:
        base-config: default
      price-oracle:
        base-config: default
