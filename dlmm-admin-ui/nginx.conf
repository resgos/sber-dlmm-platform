server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sprint 9 — Docker DNS + variable upstream so nginx re-resolves the
    # gateway IP every 10s. See twin in dlmm-user-ui/nginx.conf for the
    # full rationale + the proxy_pass quirk that requires $request_uri.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://dlmm-gateway:8080;

    location /api/ {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DS-02 — the dashboard "Здоровье сервисов" card + ApiAnalytics scrape read
    # Spring Actuator at the host root (not under /api). Without this proxy the
    # fetch fell through to the SPA index.html → parsed as empty → the card
    # showed a misleading "0 из 8 в норме". Proxy to the gateway's actuator.
    location /actuator/ {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must NOT be browser-cached — it references the content-hashed
    # asset bundles, so a stale cached copy keeps loading an OLD bundle after a
    # redeploy (stale UI until a manual hard refresh). Assets stay immutable-
    # cached below; index.html is forced to revalidate. try_files deep-links
    # redirect to /index.html and re-enter location matching, so this header
    # also covers SPA routes, not just `/`.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
